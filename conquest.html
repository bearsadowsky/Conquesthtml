<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conquest</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #69b4ff; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
  canvas { display: block; }
  .hidden { display: none !important; }

  /* ---------- menu: sizes follow the Ursina layout (1 screen unit = calc(100 * var(--u))) ---------- */
  :root { --u: min(1vh, 0.5882vw); --sx: min(calc(62 * var(--u)), calc(50vw - calc(25 * var(--u)))); --tw: min(calc(13.8 * var(--u)), calc(((100vw - calc(4 * var(--u))) * .98 - calc(12.6 * var(--u))) / 10)); }
  #menu { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  #menu > * { pointer-events: auto; }
  .band { position: absolute; left: 0; right: 0; background: rgba(5, 13, 31, .6); pointer-events: none !important; }
  #bandTop { top: 0; height: calc(20 * var(--u)); }
  #bandBottom { bottom: 0; height: calc(18.5 * var(--u)); }
  .ctr { position: absolute; left: 0; right: 0; text-align: center; transform: translateY(-50%); white-space: nowrap; pointer-events: none !important; line-height: 1; }
  #title { top: calc(8 * var(--u)); font-size: calc(9.5 * var(--u)); font-weight: 800; color: #ffd640; text-shadow: calc(.4 * var(--u)) calc(.4 * var(--u)) 0 rgba(0,0,0,.6); }
  #sub { top: calc(15.5 * var(--u)); font-size: calc(2.8 * var(--u)); color: #bed0e6; }

  .panel { position: absolute; top: calc(35 * var(--u)); width: calc(46 * var(--u)); height: calc(24 * var(--u)); background: rgba(8, 15, 36, .78); }
  #left { left: calc(50% - var(--sx) - calc(23 * var(--u))); }
  #right { left: calc(50% + var(--sx) - calc(23 * var(--u))); }
  .panel .ctr { padding: 0 calc(2.5 * var(--u)); }
  .dim { color: #7887a5; } .mut { color: #96a5be; }
  #lsel { top: calc(3.5 * var(--u)); font-size: calc(2 * var(--u)); }
  #hname { top: calc(8.5 * var(--u)); font-size: calc(6 * var(--u)); }
  #hline { position: absolute; top: calc(12.05 * var(--u)); left: calc(6.9 * var(--u)); width: calc(32.2 * var(--u)); height: calc(.3 * var(--u)); background: #fff; }
  #htag { top: calc(15.4 * var(--u)); font-size: calc(2.5 * var(--u)); }
  #lhint { top: calc(20 * var(--u)); font-size: calc(2 * var(--u)); }
  #play { position: absolute; left: calc(6 * var(--u)); top: calc(3.75 * var(--u)); width: calc(34 * var(--u)); height: calc(8.5 * var(--u)); border: 0; border-radius: calc(1 * var(--u)); font: inherit; font-size: calc(3.6 * var(--u)); font-weight: 700; color: #fff; background: #2ebe54; cursor: pointer; }
  #play:hover { background: #50de73; } #play:active { background: #1e9640; }
  #rsub { top: calc(15.5 * var(--u)); font-size: calc(2.5 * var(--u)); }
  #renter { top: calc(20 * var(--u)); font-size: calc(2 * var(--u)); }

  #roster { position: absolute; bottom: calc(1 * var(--u)); left: 50%; transform: translateX(-50%); display: flex; gap: calc(1.4 * var(--u)); }
  .tile { position: relative; width: var(--tw); height: calc(15 * var(--u)); box-sizing: border-box; background: rgba(13, 20, 41, .95); border: calc(.4 * var(--u)) solid var(--bc); cursor: pointer; }
  .tile::before { content: ''; position: absolute; inset: 0; background: transparent; }
  .tile:hover::before { background: rgba(255,255,255,.07); }
  .tile:active::before { background: rgba(255,255,255,.12); }
  .tile.locked { cursor: default; } .tile.locked:hover::before, .tile.locked:active::before { background: transparent; }
  .tile .ini { top: calc(50% - calc(2 * var(--u))); font-size: calc(6 * var(--u)); color: var(--c); }
  .tile .nm { top: auto; bottom: calc(2.6 * var(--u)); transform: translateY(50%); font-size: calc(2 * var(--u)); color: #e1e6f0; }
  .tile.locked .ini { font-size: calc(8 * var(--u)); color: #5f6c87; } .tile.locked .nm { font-size: calc(1.75 * var(--u)); color: #5f6c87; }
  .tile .ctr { padding: 0; }

  /* hover tooltip above a tile */
  #tip { position: fixed; z-index: 5; pointer-events: none; box-sizing: border-box; padding: calc(2.4 * var(--u)); background: rgba(10, 18, 38, .97); border: calc(.3 * var(--u)) solid var(--c); white-space: nowrap; }
  #tip b { display: block; font-size: calc(3.5 * var(--u)); line-height: 1.5; color: var(--c); }
  #tip div { font-size: calc(2.6 * var(--u)); line-height: 1.5; color: #ebeef5; }

  /* ---------- hud ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px #000; }
  #weapon { position: absolute; top: calc(95 * var(--u)); left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.6); padding: calc(.8 * var(--u)) calc(1.6 * var(--u)); font-size: calc(2.75 * var(--u)); white-space: pre; }
  #msg { position: absolute; top: calc(25 * var(--u)); left: 0; right: 0; transform: translateY(-50%); text-align: center; font-size: calc(5 * var(--u)); white-space: pre; }
  #cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --gap: calc(1.8 * var(--u)); }
  #cross i { position: absolute; background: #fff; }
  #cross i:nth-child(1) { width: calc(1.6 * var(--u)); height: calc(.25 * var(--u)); left: calc(-1 * var(--gap) - calc(.8 * var(--u))); top: calc(-.125 * var(--u)); }
  #cross i:nth-child(2) { width: calc(1.6 * var(--u)); height: calc(.25 * var(--u)); left: calc(var(--gap) - calc(.8 * var(--u))); top: calc(-.125 * var(--u)); }
  #cross i:nth-child(3) { width: calc(.25 * var(--u)); height: calc(1.6 * var(--u)); top: calc(-1 * var(--gap) - calc(.8 * var(--u))); left: calc(-.125 * var(--u)); }
  #cross i:nth-child(4) { width: calc(.25 * var(--u)); height: calc(1.6 * var(--u)); top: calc(var(--gap) - calc(.8 * var(--u))); left: calc(-.125 * var(--u)); }
  #cross i:nth-child(5) { width: calc(.4 * var(--u)); height: calc(.4 * var(--u)); left: calc(-.2 * var(--u)); top: calc(-.2 * var(--u)); }
  #resume { position: fixed; inset: 0; display: flex; flex-direction: column; gap: calc(2.4 * var(--u)); align-items: center; justify-content: center; background: rgba(0,0,0,.5); color: #fff; font-size: calc(4 * var(--u)); cursor: pointer; text-align: center; }
  #resume small { font-size: calc(2 * var(--u)); line-height: 1.7; color: #c8d3e6; }
  #status { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 4vw; background: #0d1426; color: #dbe4f5; font-size: calc(3 * var(--u)); line-height: 1.6; white-space: pre-wrap; }
  #online { position: absolute; left: max(1vw, calc(50% - 86 * var(--u))); top: calc(4 * var(--u)); background: rgba(0,0,0,.5); padding: calc(.6 * var(--u)) calc(1.2 * var(--u)); font-size: calc(2.25 * var(--u)); white-space: pre; }
  #online:empty { display: none; }
  #board { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; min-width: calc(60 * var(--u)); max-width: 92vw; padding: calc(2 * var(--u)) calc(3 * var(--u)); background: rgba(8, 15, 36, .88); border: calc(.3 * var(--u)) solid #ffd640; color: #fff; pointer-events: none; text-shadow: 0 1px 3px #000; }
  #board h3 { margin: 0 0 calc(1.2 * var(--u)); text-align: center; font-size: calc(3.2 * var(--u)); color: #ffd640; letter-spacing: .1em; }
  #board table { width: 100%; border-collapse: collapse; font-size: calc(2.5 * var(--u)); }
  #board th { color: #96a5be; font-weight: 600; text-align: right; padding: calc(.4 * var(--u)) calc(1.5 * var(--u)); }
  #board td { text-align: right; padding: calc(.5 * var(--u)) calc(1.5 * var(--u)); }
  #board th:first-child, #board td:first-child { text-align: left; }
  #board tr.me td { color: #ffd640; font-weight: 700; }
  #board td.sel { color: #7887a5; font-size: .8em; }
  #gginfo { position: absolute; left: max(1vw, calc(50% - 86 * var(--u))); top: calc(9 * var(--u)); background: rgba(0,0,0,.5); padding: calc(.6 * var(--u)) calc(1.2 * var(--u)); font-size: calc(2.25 * var(--u)); white-space: pre; }
  #gginfo:empty { display: none; }
  #big { position: absolute; left: 0; right: 0; top: calc(40 * var(--u)); transform: translateY(-50%); text-align: center; font-size: calc(6.5 * var(--u)); font-weight: 800; line-height: 1.2; white-space: pre; text-shadow: 0 .3vh .9vh #000; }
  #big.win { color: #ff2a2a; font-size: calc(11 * var(--u)); }
</style>
</head>
<body>

<div id="menu">
  <div class="band" id="bandTop"></div>
  <div class="band" id="bandBottom"></div>
  <div class="ctr" id="title">CONQUEST</div>
  <div class="ctr" id="sub">GUN GAME  -  GET KILLS TO CLIMB, WIN WITH A VADER KILL</div>
  <div class="panel" id="left">
    <div class="ctr dim" id="lsel">SELECTED</div>
    <div class="ctr" id="hname"></div>
    <div id="hline"></div>
    <div class="ctr mut" id="htag"></div>
    <div class="ctr dim" id="lhint">Hover a portrait to see gear</div>
  </div>
  <div class="panel" id="right">
    <button id="play">PLAY</button>
    <div class="ctr mut" id="rsub">Solo practice</div>
    <div class="ctr dim" id="renter">or press ENTER</div>
  </div>
  <div id="roster"></div>
  <div id="tip" class="hidden"></div>
</div>

<div id="hud" class="hidden">
  <div id="cross"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="online"></div>
  <div id="msg"></div>
  <div id="gginfo"></div>
  <div id="big"></div>
  <div id="weapon"></div>
</div>
<div id="resume" class="hidden">Click to play<small>WASD move &bull; Shift sprint &bull; Space jump &bull; 1/2/3 or scroll: weapon &bull; Click: use<br>R reload (Wick) &bull; Hold H: back to menu</small></div>

<div id="status" class="hidden"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* =====================================================================
   Coordinates: everything is authored in the ORIGINAL (Ursina) frame -
   left-handed, +z forward, +x right. The whole scene lives in `world`,
   which is mirrored on x, so all the original math carries over as-is.
   ===================================================================== */
THREE.ColorManagement.enabled = false;
const D2R = Math.PI / 180;
const V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const wrap = a => ((a + 180) % 360 + 360) % 360 - 180;     // python-style angle diff wrap
const rgb = (r, g, b) => (r << 16) | (g << 8) | b;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(rgb(105, 180, 255));
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 2200);
const world = new THREE.Group();
world.scale.x = -1;
scene.add(world);
let hFov = 45;      // Ursina's camera.fov is the HORIZONTAL angle; three.js wants the vertical one
function applyFov() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = 2 * Math.atan(Math.tan(hFov * D2R / 2) / camera.aspect) / D2R;
  camera.updateProjectionMatrix();
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); applyFov(); });
applyFov();

/* ------------- helpers: degree-based rotations, YXZ order like Ursina ------------- */
function addRot(o) {
  o.rotation.order = 'YXZ';
  Object.defineProperties(o, {
    rx: { get() { return this.rotation.x / D2R; }, set(v) { this.rotation.x = v * D2R; } },
    ry: { get() { return this.rotation.y / D2R; }, set(v) { this.rotation.y = v * D2R; } },
    rz: { get() { return -this.rotation.z / D2R; }, set(v) { this.rotation.z = -v * D2R; } },   // Ursina's roll is opposite
  });
  return o;
}
function G(parent, pos = [0, 0, 0]) {
  const g = addRot(new THREE.Group());
  g.position.set(pos[0], pos[1], pos[2]);
  if (parent) parent.add(g);
  return g;
}
const GEO_B = new THREE.BoxGeometry(1, 1, 1);
const GEO_S = new THREE.SphereGeometry(0.5, 16, 12);
const matCache = new Map();
function getMat(col) {
  let m = matCache.get(col);
  if (!m) { m = new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide }); matCache.set(col, m); }
  return m;
}
let REC = null;     // while Jack's rig is built, every part is recorded here (for his skeleton form)
function part(parent, model, pos, scl, col) {
  const m = addRot(new THREE.Mesh(model === 'sphere' ? GEO_S : GEO_B,
    REC ? new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide }) : getMat(col)));
  m.position.set(pos[0], pos[1], pos[2]);
  if (Array.isArray(scl)) m.scale.set(scl[0], scl[1], scl[2]); else m.scale.setScalar(scl);
  parent.add(m);
  if (REC) REC.push([m, col]);
  return m;
}
const glassCache = new Map();
function glassMat(col, opacity) {
  const key = col + ':' + opacity;
  let m = glassCache.get(key);
  if (!m) { m = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false }); glassCache.set(key, m); }
  return m;
}
function glassPart(parent, geo, pos, scl, col, opacity) {     // translucent mesh (clear white plastic, ice, ...)
  const m = addRot(new THREE.Mesh(geo, glassMat(col, opacity)));
  m.position.set(pos[0], pos[1], pos[2]);
  if (Array.isArray(scl)) m.scale.set(scl[0], scl[1], scl[2]); else m.scale.setScalar(scl);
  m.renderOrder = 2;
  parent.add(m);
  return m;
}
function authorPos(obj) {        // world position back in the original coordinates
  const v = new V3(); obj.getWorldPosition(v); v.x = -v.x; return v;
}
function orientZ(mesh, dir) {    // point a mesh's +z along an (original-frame) direction
  mesh.quaternion.setFromUnitVectors(new V3(0, 0, 1), dir.clone().normalize());
}
function uni(a, b) { return a + (b - a) * Math.random(); }

/* ------------- seeded random so every client builds the same world ------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* =====================================================================
   NETWORK (stage 5): the same JSON-over-WebSocket protocol as conquest_server.py
   Solo   = just open the page.
   Online = conquest.html?join=HOST[:PORT]&name=YOURNAME      (like --join / --name)
   ===================================================================== */
const QS = new URLSearchParams(location.search);
/* >>> PUT YOUR RENDER ADDRESS HERE, e.g. 'my-conquest.onrender.com' (no https://, no path).
   Leave it '' to play solo. Add ?solo=1 to the page address to skip the server. <<< */
const SERVER_HOST = '';
const statusEl = document.getElementById('status');
function showStatus(t) { statusEl.textContent = t; statusEl.classList.remove('hidden'); }
function makeWsUrl(host) {
  host = host.trim();
  if (/^wss?:\/\//i.test(host)) return host;
  host = host.replace(/^https?:\/\//i, '').replace(/\/+$/, '');
  const bare = host.split(':')[0];
  if (bare === 'localhost' || bare === '127.0.0.1' || bare.startsWith('192.168.') || bare.startsWith('10.')) return 'ws://' + host;
  return 'wss://' + host;
}
const STALE_BEFORE_START = new Set(['snap', 'fx', 'fire', 'explode', 'webbed', 'unwebbed', 'died']);
class NetClient {
  constructor(ws, name, welcome) {
    this.ws = ws; this.name = name; this.welcome = welcome; this.my_id = welcome.id;
    this.inbox = []; this.ready = false;       // until the game starts we only keep roster / dummy news
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (!this.ready && STALE_BEFORE_START.has(m.t)) return;
      this.inbox.push(m);
    };
    ws.onclose = () => this.inbox.push({ t: 'disconnected' });
  }
  send(obj) { try { if (this.ws.readyState === 1) this.ws.send(JSON.stringify(obj)); } catch (e) { /* the 'disconnected' message tells the player */ } }
}
function joinServer(url, name) {
  return new Promise((resolve, reject) => {
    let ws, settled = false, timer;
    const fail = msg => { if (settled) return; settled = true; clearTimeout(timer); try { ws.close(); } catch (e) {} reject(new Error(msg)); };
    try { ws = new WebSocket(url); } catch (e) { reject(new Error(e.message)); return; }
    timer = setTimeout(() => fail('the server did not answer'), 75000);
    ws.onopen = () => ws.send(JSON.stringify({ t: 'hello', name }));
    ws.onerror = () => fail('could not connect');
    ws.onclose = () => fail('the connection closed');
    ws.onmessage = ev => {
      if (settled) return;
      let msg; try { msg = JSON.parse(ev.data); } catch (e) { fail('bad reply from the server'); return; }
      if (msg.t === 'full') { fail('the server is full (max 5 players)'); return; }
      settled = true; clearTimeout(timer);
      resolve(new NetClient(ws, name, msg));
    };
  });
}
let NET = null;
{
  const host = QS.get('solo') ? '' : (QS.get('join') || SERVER_HOST || (location.hostname.endsWith('.onrender.com') ? location.host : ''));
  if (host) {
    let name = QS.get('name');
    if (!name) name = (window.prompt('Your name:') || '').trim();
    name = (name || 'Player').slice(0, 16);
    showStatus(`Connecting to ${host} ...\n(a free Render server can take up to a minute to wake up)`);
    try { NET = await joinServer(makeWsUrl(host), name); }
    catch (e) {
      showStatus(`Could not join ${host}: ${e.message}\n\nReload the page without ?join= to play solo.`);
      await new Promise(() => {});          // stop here, like the Python version exiting
    }
    statusEl.classList.add('hidden');
  }
}
function seedNum(s) {
  const n = Number(s);
  if (Number.isFinite(n)) return n;
  let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return h >>> 0;
}
const urlSeed = QS.get('seed');
const WORLD_SEED = NET ? seedNum(NET.welcome.seed) : urlSeed ? parseInt(urlSeed, 10) : Math.floor(Math.random() * 1e9);
const SPAWN_X = NET ? (NET.my_id - 3) * 2.0 : 0.0;
const wrng = mulberry32(WORLD_SEED);
const wuni = (a, b) => a + (b - a) * wrng();

/* =====================================================================
   STAGE 1 - WORLD
   ===================================================================== */
const TERRAIN_SIZE = 600;
const HILLS = Array.from({ length: 16 }, () => [wuni(-230, 230), wuni(-230, 230), wuni(2.5, 5.5), wuni(20, 40)]);
function smoothstep(a, b, v) { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function height(x, z) {
  let h = 0.9 * (0.5 + 0.5 * Math.sin(x * 0.045 + 1.3) * Math.sin(z * 0.040 + 0.4));
  let cubes = 0;
  for (const [hx, hz, ha, hs] of HILLS) {
    const d2 = (x - hx) ** 2 + (z - hz) ** 2;
    if (d2 < (hs * 3) ** 2) cubes += (ha * Math.exp(-d2 / (2 * hs * hs))) ** 3;
  }
  h += Math.cbrt(cubes);
  const spawnFlat = smoothstep(4, 20, Math.hypot(x, z));
  const edgeFade = 1 - smoothstep(220, 290, Math.max(Math.abs(x), Math.abs(z)));
  return h * spawnFlat * edgeFade;
}
const GRASS_LOW = [58, 140, 50], GRASS_HIGH = [104, 178, 72];
function grassColor(x, z, h) {
  const patch = 0.5 + 0.5 * Math.sin(x * 0.11) * Math.sin(z * 0.13 + 1.0);
  const t = clamp(0.25 + h / 9 + 0.25 * patch, 0, 1);
  return GRASS_LOW.map((lo, i) => lo + (GRASS_HIGH[i] - lo) * t);
}

// floor
{
  const g = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), getMat(rgb(...GRASS_LOW)));
  g.rotation.x = -Math.PI / 2; g.position.y = -0.05;
  world.add(g);
}
// terrain
{
  const n = 100, step = TERRAIN_SIZE / n, half = TERRAIN_SIZE / 2;
  const pos = new Float32Array((n + 1) * (n + 1) * 3), col = new Float32Array((n + 1) * (n + 1) * 3);
  const light = new V3(-0.4, 0.8, 0.45).normalize(), flat = light.y;
  let k = 0;
  for (let i = 0; i <= n; i++) for (let j = 0; j <= n; j++) {
    const x = -half + i * step, z = -half + j * step, h = height(x, z);
    const dx = height(x + 1, z) - height(x - 1, z), dz = height(x, z + 1) - height(x, z - 1);
    const normal = new V3(-dx / 2, 1, -dz / 2).normalize();
    const shade = clamp(1 + 0.9 * (normal.dot(light) - flat), 0.6, 1.25);
    const [r, g, b] = grassColor(x, z, h);
    pos.set([x, h, z], k * 3);
    col.set([Math.min(1, r * shade / 255), Math.min(1, g * shade / 255), Math.min(1, b * shade / 255)], k * 3);
    k++;
  }
  const idx = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const a = i * (n + 1) + j, b = a + 1, c = a + (n + 1), d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setIndex(idx);
  world.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide })));
}
// grid lines painted on the ground
{
  const extent = 200, spacing = 8, w = 0.04, verts = [], idx = [];
  const samples = []; for (let s = -extent; s <= extent; s++) samples.push(s);

// fake cartoon mountains: two flat-shaded rings of snow-capped pyramids all the way around the map (visual only)
{
  let seed = 90210;
  const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const sunH = [Math.sin(SUN_AZ), Math.cos(SUN_AZ)];
  const HAZE = [185, 222, 255];
  const pos = [], col = [];
  const tri = (a, b, c, color) => { pos.push(...a, ...b, ...c); col.push(...color, ...color, ...color); };
  const mix = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t);
  const mountain = (cx, cz, baseR, h, sides, rock, snow, haze) => {
    const rot = rnd() * Math.PI * 2;
    const apex = [cx + (rnd() - 0.5) * baseR * 0.2, h, cz + (rnd() - 0.5) * baseR * 0.2];
    const P = [];
    for (let k = 0; k < sides; k++) {
      const a = rot + k / sides * Math.PI * 2, r = baseR * (0.85 + 0.3 * rnd());
      P.push([cx + r * Math.cos(a), -0.05, cz + r * Math.sin(a)]);
    }
    const f = 0.66, at = (A, B, t) => [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t];
    for (let k = 0; k < sides; k++) {
      const A = P[k], B = P[(k + 1) % sides], mid = rot + (k + 0.5) / sides * Math.PI * 2;
      const lit = 0.5 + 0.5 * (Math.cos(mid) * sunH[0] + Math.sin(mid) * sunH[1]);
      const sh = 0.6 + 0.4 * lit, sh2 = 0.8 + 0.2 * lit;
      const rc = mix(rock.map(c => c * sh), HAZE, haze).map(c => c / 255);
      const sc = mix(snow.map(c => c * sh2), HAZE, haze).map(c => Math.min(1, c / 255));
      const SA = at(A, apex, f), SB = at(B, apex, f), SM = at([(A[0] + B[0]) / 2, -0.05, (A[2] + B[2]) / 2], apex, f - 0.17);
      tri(apex, SA, SM, sc); tri(apex, SM, SB, sc);                  // snow cap with a zig-zag edge
      tri(A, B, SM, rc); tri(B, SB, SM, rc); tri(A, SM, SA, rc);     // rock
    }
  };
  const ring = (count, R, jit, hMin, hMax, rock, haze, baseCap) => {
    const off = rnd() * Math.PI * 2;
    for (let i = 0; i < count; i++) {
      const a = off + (i + (rnd() - 0.5) * 0.5) / count * Math.PI * 2, r = R + (rnd() - 0.5) * 2 * jit;
      const h = hMin + rnd() * (hMax - hMin), baseR = Math.min(h * (0.62 + 0.4 * rnd()), baseCap);
      mountain(Math.cos(a) * r, Math.sin(a) * r, baseR, h, 5, rock, [246, 250, 255], haze);
    }
  };
  ring(22, 770, 30, 190, 300, [112, 126, 178], 0.5, 190);            // far ring, hazier
  ring(15, 520, 35, 110, 190, [92, 112, 168], 0.18, 200);            // near ring
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  world.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide })));
}

/* ---- Kool-Aid Man's butt-slam shockwave: a low red ring that sweeps out along the ground ---- */
const SHOCK_SEGS = 96;
class KoolShockwave {
  constructor(pos, owner, visual = false) {
    this.visual = visual; this.cx = pos.x; this.cz = pos.z; this.owner = owner; this.r = 0.5; this.hit = new Set();
    this.mat = new THREE.MeshBasicMaterial({ color: rgb(255, 36, 36), transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false });
    this.root = G(world); this.segs = [];
    for (let i = 0; i < SHOCK_SEGS; i++) { const m = new THREE.Mesh(GEO_B, this.mat); this.root.add(m); this.segs.push(m); }
    this.place(); effects.add(this);
  }
  place() {
    const r = this.r, w = (2 * Math.PI * r / SHOCK_SEGS) * 1.15 + 0.05;

      const a = i / SHOCK_SEGS * Math.PI * 2, x = this.cx + Math.sin(a) * r, z = this.cz + Math.cos(a) * r, m = this.segs[i];

    this.mat.opacity = Math.min(0.9, (SLAM_RANGE - this.r) / 8);
    this.place();

      if (Math.abs(Math.hypot(v.x - this.cx, v.z - this.cz) - this.r) > band) continue;
      if (v.y - height(v.x, v.z) > SLAM_HEIGHT) continue;        // jumped over it

function updateLaunch(o, dt) {             // thrown forward: covers 2/3 of the ghost ship's range and hits anyone he passes

        w.t += dt;
        if (w.stage === 'set' && w.t >= 0.25) { w.stage = 'tension'; w.t = 0; }
        else if (w.stage === 'tension' && ((w.released && w.t >= 0.3) || w.t >= 3.0)) beginLaunch(o);
      }
      if (o.wl) spiderLaunchAnim(o, o.wl.stage, o.wl.t, Math.min(1, o.wl.t / 0.8));
    } else if (o.weapon === 'webshooter' && o.punch_t === null) {
      const pitch = clamp(o.pitch, -45, 45), rec = o.web_recoil;
      o.right_arm.rx = -86 + pitch * 0.9 - rec * 14; o.right_fore.rx = -8 - rec * 12;
      o.left_arm.rx = SPIDER_GUARD_L[0]; o.left_fore.rx = SPIDER_GUARD_L[1];
      o.right_arm.ry = -4; mr.position.z = -0.05 * rec;
    } else {
      o.right_arm.ry = lerp(o.right_arm.ry, 0, k15);
    }
    if (o.weapon === 'webshooter') setWeaponText('Web Shooter   ' + (o.web_cd <= 0 ? 'Ready' : o.web_cd.toFixed(1) + 's'));
    else if (o.weapon === 'weblaunch') {
      if (o.wl && o.wl.stage !== 'fly') setWeaponText('Web Launch   Let go to launch!');
      else setWeaponText('Web Launch   ' + (o.wl_cd > 0 ? o.wl_cd.toFixed(1) + 's' : 'Ready (hold click)'));
    }
    else setWeaponText('Strike');
  }

  if (k === 'warden') {
    if (o.saber_cd > 0) o.saber_cd = Math.max(0, o.saber_cd - dt);
    if (o.weapon === 'saber') {
      if (mouseHeld && o.saber_cd <= 0) useWeapon(o);                   // hold click = a swing every 0.6 s
      setWeaponText('Lightsaber   ' + (o.saber_cd > 0 ? o.saber_cd.toFixed(1) + 's' : 'Ready'));
    }
  }

  if (k === 'koolaid') {
    if (o.slam_cd > 0) o.slam_cd = Math.max(0, o.slam_cd - dt);
    const sl = o.slam;
    if (sl) {
      sl.t += dt;
      if (sl.stage === 'air') {
        const falling = o.vy < 0;
        const la = falling ? -88 : -20, aa = falling ? -35 : -150;      // up: arms overhead. falling: legs thrust out front
        o.left_leg.rx = lerp(o.left_leg.rx, la, k15); o.right_leg.rx = lerp(o.right_leg.rx, la, k15);
        o.left_arm.rx = lerp(o.left_arm.rx, aa, k15); o.right_arm.rx = lerp(o.right_arm.rx, aa, k15);
        mr.rx = lerp(mr.rx, falling ? -14 : 6, k15);
        if (o.grounded && sl.t > 0.1) {                                 // landed on his butt
          sl.stage = 'sit'; sl.t = 0;
          new KoolShockwave(new V3(o.x, o.y, o.z), o);
          if (NET) NET.send({ t: 'fx', k: 'slam', p: [r2(o.x), r2(o.y), r2(o.z)] });
          new ExplosionFx(new V3(o.x, o.y + 0.5, o.z), 2.2, rgb(255, 60, 60), false);
        }
      } else {
        const t = sl.t;
        if (t < 0.35) {                                                  // sitting on the ground, legs out
          mr.position.y = lerp(mr.position.y, -0.42, Math.min(1, 30 * dt)); mr.rx = lerp(mr.rx, -8, k15);
          o.left_leg.rx = o.right_leg.rx = -88; o.left_arm.rx = o.right_arm.rx = 35;
        } else if (t < 0.58) {                                           // pops back up
          const u = (t - 0.35) / 0.23;
          mr.position.y = -0.42 * (1 - u) + Math.sin(Math.PI * u) * 0.45; mr.rx = lerp(mr.rx, 0, k15);
          o.left_leg.rx = o.right_leg.rx = -88 * (1 - u); o.left_arm.rx = o.right_arm.rx = 35 * (1 - u);
        } else o.slam = null;
      }
    }
    if (o.straw_cd > 0) o.straw_cd = Math.max(0, o.straw_cd - dt);
    if (o.burst) {                                                       // 3-round burst, no reload
      if (o.weapon !== 'straw' || o.slam) o.burst = null;
      else {
        o.burst.t -= dt;
        if (o.burst.t <= 0) { fireStraw(o); o.burst.left--; o.burst.t = STRAW_GAP; if (o.burst.left <= 0) o.burst = null; }
      }
    }
    if (o.weapon === 'straw') { if (mouseHeld && !o.burst && o.straw_cd <= 0) useWeapon(o); poseStraw(o.straw, o.pitch); }   // hold click = burst after burst
    if (o.weapon === 'slam') setWeaponText('Butt Slam   ' + (o.slam_cd <= 0 ? 'Ready' : o.slam_cd.toFixed(1) + 's'));
    else if (o.weapon === 'straw') setWeaponText('Pink Straw   ' + (o.straw_cd <= 0 ? 'Ready (3-shot burst)' : o.straw_cd.toFixed(1) + 's'));
    else setWeaponText('Headbutt');
  }

  if (k === 'spongebob') {
    if (o.spray_cd > 0) o.spray_cd -= dt;
    if (o.weapon === 'bubbler') {
      if (mouseHeld && o.spray_cd <= 0) { o.spray_cd = SPRAY_RATE; spraySpawn(o); }
      o.bubbler.position.z = lerp(o.bubbler.position.z, 0.5 - (mouseHeld ? 0.08 : 0), Math.min(1, 20 * dt));
      o.bubbler.rx = clamp(o.pitch, -50, 20) * 0.7;
    }
    if (o.weapon === 'gun') {
      o.recoil = lerp(o.recoil, 0, Math.min(1, 12 * dt));
      o.gun.position.z = 0.5 - o.recoil;
      o.gun.rx = clamp(o.pitch, -50, 20) * 0.7;
    }
  }
}
function updatePistol(o, dt) {
  if (o.pistol_cd > 0) o.pistol_cd -= dt;
  o.pistol_bloom = Math.max(0, o.pistol_bloom - PISTOL_BLOOM_DECAY * dt);
  crossEl.style.setProperty('--gap', `calc(${1.8 + o.pistol_bloom * 0.45} * var(--u))`);   // the crosshair opens up to show the bloom
  o.pistol_recoil = Math.max(0, o.pistol_recoil - dt * 9);
  let T = 0;
  if (o.reload_t !== null) {
    o.reload_t += dt;
    if (o.reload_t >= PISTOL_RELOAD) { o.reload_t = null; o.ammo = PISTOL_MAG; } else T = o.reload_t / PISTOL_RELOAD;
  }
  if (o.weapon !== 'pistol') return;
  const pr = o.pistol, pitch = clamp(o.pitch, -45, 45), rec = o.pistol_recoil;
  const aRu = -88 + pitch * 0.9 - rec * 12, aRf = -6 - rec * 10, aLu = -84 + pitch * 0.9, aLf = -14;
  let w = o.reload_t !== null ? Math.max(0, Math.min(1, T / 0.15, (1 - T) / 0.15)) : 0;
  w = w * w * (3 - 2 * w);
  const dip = Math.sin(Math.PI * clamp((T - 0.3) / 0.4, 0, 1));
  o.right_arm.rx = aRu + (-55 - aRu) * w;
  o.right_fore.rx = aRf + (-105 - aRf) * w;
  o.left_arm.rx = aLu + (-62 - aLu) * w;
  o.left_fore.rx = aLf + ((-100 + 22 * dip) - aLf) * w;
  o.right_arm.ry = -7 * (1 - w); o.left_arm.ry = 9 * (1 - w);
  o.model_root.ry = 0; o.model_root.position.z = -0.07 * rec;
  pr.root.rx = 90 - 40 * w;
  pr.slide.position.z = 0.2 - 0.07 * rec;
  if (o.reload_t === null) { pr.mag.visible = true; pr.mag.position.y = -0.24; }
  else if (T < 0.22) { pr.mag.visible = true; pr.mag.position.y = -0.24 - (T / 0.22) * 0.55; }
  else if (T < 0.55) pr.mag.visible = false;
  else { pr.mag.visible = true; pr.mag.position.y = -0.79 + Math.min(1, (T - 0.55) / 0.25) * 0.55; }

}

/* ---- movement / main player update ---- */
let hHold = 0, leaving = false;
function updatePlayer(o, dt) {
  // hold H to go back to character select
  const gLocked = NET && (gg.phase === 'countdown' || gg.phase === 'ended');
  if (keys.KeyH && gLocked) {
    hHold = 0;
    if (gg.phase === 'countdown') showMsg("You can't leave during the countdown", 0.15);
  } else if (keys.KeyH) {
    hHold += dt;
    if (hHold > 0.2 && !leaving) {
      const n = Math.floor(Math.min(1, hHold / 1.5) * 10);
      showMsg('Hold H to leave to the menu  [' + '#'.repeat(n) + '-'.repeat(10 - n) + ']', 0.15);
      if (hHold >= 1.5) { leaving = true; returnToMenu(); return; }
    }
  } else hHold = 0;

  if (o.web_t > 0) {                                       // stuck in someone's web: can look and shoot, can't move
    o.web_t = Math.max(0, o.web_t - dt);
    showMsg(`STUCK IN AN ELECTRIC WEB   ${o.web_t.toFixed(1)}s`, 0.15);
  }
  const fwd = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), side = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  const sy = Math.sin(o.yaw * D2R), cy = Math.cos(o.yaw * D2R);
  let dx = sy * fwd + cy * side, dz = cy * fwd - sy * side;
  const len = Math.hypot(dx, dz);
  const moving = len > 0 && !(o.web_t > 0) && !o.wl && !(o.slam && o.slam.stage === 'sit');
  if (moving) {
    dx /= len; dz /= len;
    let speed = sprinting() ? Player.RUN : Player.WALK;
    if (o.skeleton) speed *= SKEL_MOVE_MULT;
    if (o.kind === 'warden' && o.weapon === 'saber') speed *= SABER_BOOST;
    if (o.weapon === 'bubbler') speed *= 0.5;                   // the bubble launcher slows you to half speed
    o.x = clamp(o.x + dx * speed * dt, -285, 285);
    o.z = clamp(o.z + dz * speed * dt, -285, 285);
  }
  const aiming = ['gun', 'bubbler', 'pistol', 'webshooter', 'weblaunch'].includes(o.weapon) || o.punch_t !== null || (o.point_t !== null && o.point_t !== undefined);
  if (aiming) o.body.ry += wrap(o.yaw - o.body.ry) * Math.min(1, 20 * dt);
  else if (moving) o.body.ry += wrap(Math.atan2(dx, dz) / D2R - o.body.ry) * Math.min(1, 6 * dt);
  else o.body.ry += wrap(o.yaw - o.body.ry) * Math.min(1, 4 * dt);

  // bush collisions: shoved out sideways, can climb on top of low ones
  const pr = o.kind === 'koolaid' ? 0.9 * KOOL_SCALE : Player.RADIUS;
  for (let pass = 0; pass < 2; pass++) for (const [cx, cy, cz, rx, ry, rz] of bushLumps) {
    const ddx = o.x - cx, ddz = o.z - cz, d = (ddx / (rx + pr)) ** 2 + (ddz / (rz + pr)) ** 2;
    if (d >= 1) continue;
    const top = cy + ry * Math.sqrt(Math.max(0, 1 - d));
    if (o.y >= top - Player.STEP_UP) continue;
    if (d > 1e-6) { const kk = 1 / Math.sqrt(d); o.x = cx + ddx * kk; o.z = cz + ddz * kk; } else o.x += rx + pr;
  }
  let groundY = height(o.x, o.z);
  for (const [cx, cy, cz, rx, ry, rz] of bushLumps) {
    const ddx = o.x - cx, ddz = o.z - cz, d = (ddx / (rx + pr * 0.5)) ** 2 + (ddz / (rz + pr * 0.5)) ** 2;
    if (d >= 1) continue;
    const top = cy + ry * Math.sqrt(Math.max(0, 1 - d));
    if (o.y >= top - Player.STEP_UP) groundY = Math.max(groundY, top);
  }
  if (o.wl && o.wl.stage === 'fly') updateLaunch(o, dt);
  else {
    o.vy -= Player.GRAV * (o.slam && o.slam.stage === 'air' && o.vy < 0 ? 1.8 : 1) * dt; o.y += o.vy * dt;
    if (o.y <= groundY) { o.y = groundY; o.vy = 0; o.grounded = true; }
    else if (o.grounded && o.y - groundY < 0.4 && o.vy <= 0) { o.y = groundY; o.vy = 0; o.grounded = true; }
    else o.grounded = false;
  }
  o.root.position.set(o.x, o.y, o.z);

  if (o.kind === 'jack') animateJack(o, moving, dt);
  else if (o.kind === 'wick') animateWick(o, moving, dt);
  else if (o.kind === 'spiderman') spiderAnim(o, moving && o.grounded, sprinting(), !o.grounded, dt);
  else if (o.kind === 'koolaid') animateKool(o, moving, dt);
  else if (o.kind === 'warden' && o.weapon === 'saber') animateWarden(o, moving, dt);
  else animateSponge(o, moving, dt);
  updateWeapons(o, dt);
  if (o.dog) o.dog.update(dt);

  if (NET) {                                               // tell everyone where we are and what we're doing, 20x a second
    o.net_t += dt;
    if (o.net_t >= 0.05) {
      o.net_t = 0;
      const msg = { t: 's', x: r2(o.x), y: r2(o.y), z: r2(o.z), ry: r1(o.body.ry), w: o.weapon === 'gun' ? 1 : 0, k: o.kind, wp: o.weapon,
        pt: o.punch_t !== null ? Math.round(o.punch_t * 1000) / 1000 : -1, pp: r1(o.pitch) };
      if (o.skeleton) msg.sk = 1;
      if (o.wl) msg.wl = { set: 1, tension: 2, fly: 3 }[o.wl.stage];
      const dg = o.dog;
      if (dg && dg.alive) msg.dg = [r1(dg.x), r1(dg.z), Math.round(dg.ry)];
      NET.send(msg);
    }
  }

  const gy = height(o.x, o.z);
  o.shadow.position.set(o.x, gy + 0.05, o.z);
  o.shadow.scale.setScalar(Math.max(0.4, 1.0 - (o.y - gy) * 0.15) * (o.kind === 'koolaid' ? 2.0 * KOOL_SCALE : 1));

  updateCamera(o, dt);
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) hudMsg.textContent = ''; }
}

/* =====================================================================
   INPUT
   ===================================================================== */
const keys = {};
let mouseHeld = false;
let mode = 'menu';           // 'menu' | 'play'
let me = null;
const canvas = renderer.domElement;
const resumeEl = document.getElementById('resume');

addEventListener('keydown', e => {
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.code === 'Tab') { e.preventDefault(); showBoard(true); return; }
  if (e.repeat) return;
  keys[e.code] = true;
  if (mode === 'menu') {
    const order = Object.keys(CHAR_INFO), i = order.indexOf(selected);
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') selectCharacter(order[(i - 1 + order.length) % order.length]);
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') selectCharacter(order[(i + 1) % order.length]);
    else if (e.code === 'Enter') startGame();
    return;
  }
  if (!me) return;
  if (e.code === 'Space' && me.grounded && !me.wl && !me.slam && !(me.web_t > 0)) {
    me.vy = Player.JUMP * (me.skeleton ? Math.sqrt(SKEL_JUMP_MULT) : 1) * (me.kind === 'warden' && me.weapon === 'saber' ? Math.sqrt(SABER_BOOST) : 1);   // jump height goes with vy squared, so sqrt(1.25) = 25% higher me.grounded = false;
  } else if (e.code === 'KeyR' && me.kind === 'wick' && me.weapon === 'pistol') {
    if (me.reload_t === null && me.ammo < PISTOL_MAG) me.reload_t = 0;
  } else if (e.code === 'KeyQ' && !e.repeat) cycleWeapon(me, -1);
  else if (e.code === 'KeyE' && !e.repeat) cycleWeapon(me, 1);
  else if (e.code.startsWith('Digit')) {
    const i = parseInt(e.code.slice(5), 10) - 1;
    if (i >= 0 && i < me.weapons.length) setWeapon(me, me.weapons[i]);
  }
});
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Tab') showBoard(false); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouseHeld = false; showBoard(false); });
addEventListener('mousemove', e => {
  if (mode !== 'play' || !me || document.pointerLockElement !== canvas) return;
  me.yaw += e.movementX * 0.12;
  me.pitch = clamp(me.pitch + e.movementY * 0.12, Player.PITCH_UP, Player.PITCH_DOWN);
});
addEventListener('mousedown', e => {
  if (mode !== 'play' || !me || e.button !== 0 || document.pointerLockElement !== canvas) return;
  mouseHeld = true; useWeapon(me);
});
addEventListener('mouseup', e => {
  if (e.button !== 0) return;
  mouseHeld = false;
  if (me && me.wl) me.wl.released = true;
});
addEventListener('wheel', e => { if (mode === 'play' && me) cycleWeapon(me, e.deltaY < 0 ? 1 : -1); }, { passive: true });
document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === canvas;
  resumeEl.classList.toggle('hidden', locked || mode !== 'play');
});
resumeEl.addEventListener('click', () => canvas.requestPointerLock());

  wick: { name: 'John Wick', short: 'WICK', initials: 'JW', tag: 'BABA YAGA', gear: ['Jab', 'Pistol (8 rounds)', 'Whistle + Dog'], accent: '#a0afcd' },
  spiderman: { name: 'Spider-Man', short: 'SPIDER-MAN', initials: 'SM', tag: 'WEB-SLINGER', gear: ['Strike', 'Electric Web Shooter', 'Web Launch'], accent: '#5078eb' },
  koolaid: { name: 'Kool-Aid Man', short: 'KOOL-AID', initials: 'KA', tag: 'OH YEAH!', gear: ['Headbutt', 'Butt Slam', 'Pink Straw'], accent: '#e8333f' },

/* ---- text fitting: like the Python measure-then-shrink, but on real DOM text ---- */
const vh = () => Math.min(innerHeight / 100, innerWidth / 170);   // the UI unit: shrinks on narrow windows so nothing overlaps
function fitText(el, maxW, basePx) {
  el.style.fontSize = basePx + 'px';
  const range = document.createRange(); range.selectNodeContents(el);
  const w = range.getBoundingClientRect().width;
  if (w > maxW) el.style.fontSize = Math.max(basePx * 0.4, basePx * maxW / w * 0.97) + 'px';
}

/* ---- roster strip: 10 slots, the ones without a fighter yet are "?" and can't be clicked ---- */
const rosterEl = document.getElementById('roster'), tipEl = document.getElementById('tip'), tiles = [];
const MUTED_ACCENT = '#78879f';

for (let i = 0; i < 10; i++) {
  const kind = Object.keys(CHAR_INFO)[i], info = CHAR_INFO[kind], el = document.createElement('div');
  el.className = 'tile' + (info ? '' : ' locked');
  const accent = info ? info.accent : '#505c76';
  el.style.setProperty('--c', accent);
  el.style.setProperty('--bc', hexA(accent, info ? 1 : 0.18));
  el.innerHTML = info
    ? `<div class="ctr ini">${info.initials}</div><div class="ctr nm">${info.short}</div>`
    : `<div class="ctr ini">?</div><div class="ctr nm">SOON</div>`;
  if (info) el.addEventListener('click', () => selectCharacter(kind));
  el.addEventListener('mouseenter', () => showTip(el, info));
  el.addEventListener('mouseleave', hideTip);
  rosterEl.appendChild(el);
  tiles.push({ kind, el });
}
function fitTiles() {
  const inner = tiles[0].el.getBoundingClientRect().width - 2 * vh();
  for (const t of tiles) {
    fitText(t.el.querySelector('.ini'), inner, (t.kind ? 6 : 8) * vh());
    fitText(t.el.querySelector('.nm'), inner, (t.kind ? 2 : 1.75) * vh());
  }
}

/* ---- hover tooltip: a fighter's gear above its tile, clamped so it stays on screen ---- */
function showTip(tileEl, info) {
  tipEl.style.setProperty('--c', info ? info.accent : MUTED_ACCENT);
  tipEl.innerHTML = info
    ? `<b>${info.name}</b>${info.gear.slice(0, 4).map(g => `<div>${g}</div>`).join('')}`
    : '<b>???</b><div>Coming soon</div>';
  tipEl.classList.remove('hidden');
  tipEl.style.fontSize = '';
  const maxInner = Math.min(60 * vh(), innerWidth - 14 * vh());       // like min(0.6, SAFE_X*2 - 0.1)
  let w = tipEl.getBoundingClientRect().width;
  const pad = 4.8 * vh();
  if (w - pad > maxInner) {                                           // too wide: shrink everything to fit
    const k = maxInner / (w - pad);
    tipEl.style.zoom = k;
    w = tipEl.getBoundingClientRect().width;
  } else tipEl.style.zoom = '';
  const r = tileEl.getBoundingClientRect(), h = tipEl.getBoundingClientRect().height, edge = 2 * vh();
  const cx = Math.max(edge, Math.min(innerWidth - edge - w, r.left + r.width / 2 - w / 2));
  tipEl.style.left = cx + 'px';
  tipEl.style.top = (r.top - 1.2 * vh() - h) + 'px';
}
function hideTip() { tipEl.classList.add('hidden'); }
addEventListener('resize', () => { fitTiles(); fitHero(); hideTip(); });

const heroEl = document.getElementById('hname'), tagEl = document.getElementById('htag');
function fitHero() {
  const maxW = 46 * vh() - 5 * vh();                                  // HERO_W - 0.05
  fitText(heroEl, maxW, 6 * vh()); fitText(tagEl, maxW, 2.5 * vh());
}
function selectCharacter(kind) {
  selected = kind;
  const info = CHAR_INFO[kind];

  if (pid === NET.my_id) return null;
  let r = remotes.get(pid);
  if (r && kind && CHAR_INFO[kind] && r.kind !== kind) {      // they picked a different character: rebuild their model
    name = name || r.name; r.cleanup(); remotes.delete(pid); r = null;
  }
  if (!r) { r = new RemotePlayer(pid, name || `Player ${pid}`, CHAR_INFO[kind] ? kind : 'spongebob'); remotes.set(pid, r); }
  else if (name) r.setName(name);
  return r;
}
const vec = a => new V3(a[0], a[1], a[2]);
function handleFx(m) {                                         // another player used an ability: show it (their own game does the damage)
  const k = m.k, r = remotes.get(m.id);
  try {
    if (k === 'ship') new GhostShip(vec(m.p), new V3(m.d[0], 0, m.d[1]), null, true);
    else if (k === 'spray') new SprayBubble(vec(m.p), vec(m.v), null, true);
    else if (k === 'shot') {
      const start = vec(m.p), end = vec(m.e);
      new Tracer(start, end, rgb(255, 235, 140), 0.06);
      new ExplosionFx(start, 0.45, rgb(255, 220, 120), false);
      if (m.i) new ExplosionFx(end, 0.7, rgb(255, 240, 200), false);
      if (r) r.recoil = 1.0;
    } else if (k === 'straw') { new StrawShot(vec(m.p), vec(m.v), null, true); new ExplosionFx(vec(m.p), 0.3, rgb(235, 60, 70), false); }
    else if (k === 'webshot') { new WebShot(vec(m.p), vec(m.v), null, true); if (r) r.recoil = 1.0; }
    else if (k === 'wlstart' && r) makeAnchorWebs(r, m.p);
    else if (k === 'wlgo' && r) dropAnchorWebs(r);
    else if (k === 'webt') { const t = targets.find(x => x.index === m.i); if (t) makeWeb(t, WEB_TIME); }
    else if (k === 'point' && r) r.point_t = 0;
    else if (k === 'med' && r) r.med_t = 0;
    else if (k === 'whistle' && r) { r.whistle_t = 0; r.whistle_blown = false; }
    else if (k === 'slam') {
      new KoolShockwave(vec(m.p), null, true);
      new ExplosionFx(new V3(m.p[0], m.p[1] + 0.5, m.p[2]), 2.2, rgb(255, 60, 60), false);
    }
  } catch (e) { /* a malformed effect message must never break the game */ }
}
function shooterOf(key) { const id = parseInt(String(key).split(':')[0], 10); return Number.isNaN(id) ? null : (remotes.get(id) || null); }
function handleNet(m) {
  const t = m.t;
  if (t === 'gg') { ggState(m); return; }
  if (t === 'lvl') { ggLevel(m); return; }
  if (t === 'win') { ggWin(m); return; }
  if (t === 'kick') { ggKick(); return; }
  if (netStateReady) {
    if (t === 'join') netRoster.set(m.id, m.name);
    else if (t === 'leave') netRoster.delete(m.id);
    else if (t === 'thit') { if (m.hp <= 0) netDeadTargets.add(m.i); else netDeadTargets.delete(m.i); }
    else if (t === 'trevive') netDeadTargets.delete(m.i);
  }
  if (t === 'died') tallyDeath(m);
  else if (t === 'fx' && m.k === 'kill' && !serverNamesKiller && Number.isInteger(m.v)) creditKill(m.id, m.v);
  if (!me && ['snap', 'join', 'leave', 'fire', 'explode', 'thit', 'trevive', 'died', 'fx', 'webbed', 'unwebbed'].includes(t)) return;   // in character select: tracked above, nothing to show
  if (t === 'snap') {
    for (const [key, a] of Object.entries(m.p)) {
      const pid = parseInt(key, 10);
      if (pid === NET.my_id) {
        if (me && !me.skeleton && Math.abs(me.hp - a[7]) > 0.01) { me.hp = a[7]; me.bar.set(me.hp / me.max_hp); }
      } else {
        const r = ensureRemote(pid, null, a.length > 8 ? a[8] : null);
        if (r) r.setState(...a.slice(0, 8), a.length > 9 && a[9] && typeof a[9] === 'object' ? a[9] : null);
      }
    }
  } else if (t === 'join') { ensureRemote(m.id, m.name); refreshRoster(); showMsg(`${m.name} joined`, 2.5); }
  else if (t === 'leave') {
    const r = remotes.get(m.id);
    if (r) { remotes.delete(m.id); showMsg(`${r.name} left`, 2.5); r.cleanup(); refreshRoster(); }
  } else if (t === 'fire') {
    new Burger(vec(m.p), vec(m.v), m.b, false);
    const sh = shooterOf(m.b); if (sh) sh.gunFired();
  } else if (t === 'fx') handleFx(m);
  else if (t === 'webbed' || t === 'unwebbed') {
    const victim = m.id === NET.my_id ? me : remotes.get(m.id);
    if (victim) {
      if (t === 'webbed') {
        const dur = parseFloat(m.dur ?? WEB_TIME);
        makeWeb(victim, dur);
        if (victim === me) me.web_t = dur;
      } else { clearWeb(victim); if (victim === me) me.web_t = 0; }
    }
  } else if (t === 'explode') {
    const pos = vec(m.p), b = burgers.get(m.b);
    if (b) { effects.delete(b); b.dispose(); }
    new ExplosionFx(pos, SPLASH_RADIUS, rgb(255, 140, 30));
    if (me && me.dog && me.dog.alive) {
      const dg = me.dog, dd = new V3(dg.x, dg.y + 0.5, dg.z).distanceTo(pos);
      if (dd < SPLASH_RADIUS) dg.takeDamage(SPLASH_DAMAGE * (1 - 0.4 * dd / SPLASH_RADIUS), pos, shooterOf(m.b));
    }
    if (me) {
      const d = new V3(me.x, me.y + 1, me.z).distanceTo(pos);
      if (d < SPLASH_RADIUS) { me.vy = Math.max(me.vy, 9 * (1 - 0.6 * d / SPLASH_RADIUS)); me.grounded = false; }
    }
  } else if (t === 'thit') { if (targets[m.i]) targets[m.i].netHit(m.hp, m.kx, m.kz); }
  else if (t === 'trevive') { if (targets[m.i]) targets[m.i].revive(); }
  else if (t === 'died') {
    showMsg(m.text, 2.5);
    if (m.id === NET.my_id && me) respawnPlayer();
  } else if (t === 'disconnected') showMsg('Lost connection to the server', 2.5);
}
function pumpNet() { for (const m of NET.inbox.splice(0)) handleNet(m); }

/* ---- gun game: the server runs the ladder, the lobby countdown and the win ---- */
const GUN_ORDER = Object.keys(CHAR_INFO);          // spongebob, jack, wick, spiderman, koolaid, warden (Vader = last)
const gg = { phase: 'off', level: 0 };
const ggLevels = new Map();
const bigEl = document.getElementById('big'), ggInfoEl = document.getElementById('gginfo');
let bigTimer = 0;
function setBig(text, cls = '', secs = 0) {
  clearTimeout(bigTimer);
  bigEl.textContent = text; bigEl.className = cls;
  if (secs) bigTimer = setTimeout(() => { bigEl.textContent = ''; }, secs * 1000);
}
function ggHud() {
  if (!NET || mode !== 'play') { ggInfoEl.textContent = ''; return; }
  const last = GUN_ORDER.length - 1, lv = gg.level;
  ggInfoEl.textContent = `GUN GAME   Level ${lv + 1}/${last + 1}: ${CHAR_INFO[GUN_ORDER[lv]].name}\n`
    + (lv < last ? `Next: ${CHAR_INFO[GUN_ORDER[lv + 1]].name}` : 'Get a kill to WIN!');
}
function switchCharacter(kind, tx, tz) {            // become another character: full health, optionally somewhere else
  if (!me || !CHAR_INFO[kind]) return;
  const old = me, x = tx !== undefined ? clamp(tx, -285, 285) : old.x, z = tz !== undefined ? clamp(tz, -285, 285) : old.z;
  const yaw = old.yaw, pitch = old.pitch, bodyRy = old.body.ry;
  destroyPlayer(old);
  mouseHeld = false;
  me = makePlayer(kind);
  Object.assign(me, { x, z, y: height(x, z), yaw, pitch });
  me.body.ry = bodyRy; me.root.position.set(me.x, me.y, me.z); me.camPos.set(me.x, me.y + 1.6, me.z);
  me.hp = me.max_hp; me.bar.set(1);
  crossEl.style.setProperty('--gap', 'calc(1.8 * var(--u))');
  selected = kind;
}
function ggState(m) {
  ggLevels.clear();
  for (const k in (m.lv || {})) ggLevels.set(parseInt(k, 10), m.lv[k]);
  const prev = gg.phase;
  gg.phase = m.phase;
  if (!me) return;
  const lv = ggLevels.get(NET.my_id);
  if (lv !== undefined) { gg.level = lv; if (GUN_ORDER[lv] !== me.kind) switchCharacter(GUN_ORDER[lv]); }
  if (m.phase === 'lobby') setBig('Waiting for another player...\nHold H to go back to the menu');
  else if (m.phase === 'countdown') setBig(`Game starts in ${m.left}`);
  else if (m.phase === 'playing') {
    if (prev === 'countdown') setBig('GO!', '', 1.2); else { setBig(''); showMsg('Game in progress - catch up!', 2.5); }
  }
  ggHud();
}
function ggLevel(m) {                                // someone got a kill and moved up
  ggLevels.set(m.id, m.level);
  if (!me || m.id !== NET.my_id) return;
  gg.level = m.level;
  switchCharacter(m.kind, m.x, m.z);
  showMsg(`LEVEL UP!  You are now ${CHAR_INFO[m.kind].name}`, 2.5);
  ggHud();
}
function ggWin(m) {                                  // a kill with Vader: show it in red until everyone is kicked
  if (!me) return;
  gg.phase = 'ended';
  setBig(m.text || `${m.name} WON!`, 'win');
}
function ggKick() { if (me) returnToMenu(); }

function startGame() {
  if (mode === 'play') return;
  mode = 'play'; leaving = false; hHold = 0; hideTip();
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  menuGroup.visible = false;
  me = makePlayer(NET ? GUN_ORDER[0] : selected);   // online: the gun game starts everyone as the first fighter                           // a brand-new player: full health, every cooldown ready
  Object.assign(me, { x: ghostPos.x, y: ghostPos.y, z: ghostPos.z, yaw: ghostPos.yaw });
  me.body.ry = ghostPos.ry; me.root.position.set(me.x, me.y, me.z); me.camPos.set(me.x, me.y + 1.6, me.z);
  if (NET) NET.send({ t: 'reset' });                   // ask the server to refill our health too
  if (NET) {                                          // the server decides where the dummies stand
    NET.welcome.targets.forEach(([tx, tz], i) => targets.push(new Target(tx, tz, i)));
    initNetState();
    for (const [pid, name] of netRoster) ensureRemote(pid, name);
    for (const i of netDeadTargets) if (i < targets.length) targets[i].netHit(0, 0, 0);
    refreshRoster();
    NET.ready = true; netPumpOn = true;
    gg.phase = 'lobby'; gg.level = 0; ggHud();
    setBig('Waiting for another player...\nHold H to go back to the menu');
    NET.send({ t: 'ready' });                         // I clicked Play
  } else {
    for (let i = 0; i < 8; i++) {                     // eight target dummies in a ring around the spawn
      const ang = i / 8 * Math.PI * 2 + uni(-0.2, 0.2), r = uni(18, 45);
      targets.push(new Target(Math.cos(ang) * r, Math.sin(ang) * r, i));
    }
  }
  hFov = 75; applyFov();
  hudMsg.textContent = '';
  canvas.requestPointerLock();
  resumeEl.classList.add('hidden');
}
function returnToMenu() {
  if (!me) return;
  ghostPos = { x: me.x, y: me.y, z: me.z, ry: me.body.ry, yaw: me.yaw };
  showBoard(false);
  clearEffects(); webs.clear(); anchorWebs.clear(); burgers.clear();
  for (const r of remotes.values()) r.cleanup();
  remotes.clear();
  for (const t of targets) world.remove(t.root);
  targets.length = 0;
  destroyPlayer(me); me = null;
  mode = 'menu'; mouseHeld = false;
  if (NET) NET.send({ t: 'unready' });
  gg.phase = 'off'; gg.level = 0; ggLevels.clear(); setBig(''); ggInfoEl.textContent = '';
  if (document.pointerLockElement) document.exitPointerLock();
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
  resumeEl.classList.add('hidden');
  menuGroup.visible = true;
  selectCharacter(selected);
}
document.getElementById('play').addEventListener('click', startGame);
if (NET) document.getElementById('rsub').textContent = 'Online as ' + NET.name;
selectCharacter(selected);
fitTiles();
document.fonts?.ready.then(() => { fitTiles(); fitHero(); });

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  if (NET && netPumpOn) pumpNet();
  if (NET && mode === 'menu') sendGhost(dt);
  if (boardOn) { boardT += dt; if (boardT > 0.2) { boardT = 0; renderBoard(); } }
  if (mode === 'menu') updateMenu(dt);
  else if (me) { updatePlayer(me, dt); for (const t of targets) t.update(dt); for (const r of remotes.values()) r.update(dt); }
  updateEffects(dt);
  sunSpin.rotation.z += dt * 0.15; sunSpin.scale.setScalar(1 + 0.025 * Math.sin(clock.elapsedTime * 2));
  renderer.render(scene, camera);
}
frame();
</script>
